{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="{% static 'main/style.css' %}">
    <title>{% block title %}Van Pallethout{% endblock %}</title>
</head>

<body>
    {% block banner %}{% endblock %}
    {% block navigation %}
    <nav role="navigation" class="navbar navbar-expand-sm navbar-light bg-light sticky-top">
      <div class="container-fluid" id="nav-bar">
        <a class="navbar-brand" href="% url 'main:index' %}">
          <img src="{% static 'main/images/logo_black.gif' %}" alt="" width="60" height="60">
          Van Pallethout
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link"href="{% url 'main:index' %}">Home</a></li>
            <li class="nav-item"><a class="nav-link"href="{% url 'main:info' %}">Info</a></li>
            <li class="nav-item"><a class="nav-link"href="{% url 'main:projects' %}">Projects</a></li>
            <li class="nav-item"><a class="nav-link"href="{% url 'main:workshops' %}">Workshops</a></li>
            <li class="nav-item"><a class="nav-link"href="{% url 'products:index' %}">Products</a></li>
            <li class="nav-item"><a class="nav-link"href="{% url 'gallery:index' %}">Gallery</a></li>
            <li class="nav-item"><a class="nav-link"href="{% url 'main:contact' %}">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
    {% endblock %}

    <div class="container-lg my-5" id="content">
        {% block content %}{% endblock %}
    </div>

    <div class="container-fluid bg-light sticky-bottom" id="footer">
      <div class="row">
        <p>Copyright &#169 <a href="{% url 'main:index' %}">Van Pallethout</a></p>
        <p>
          <a href="https://www.facebook.com/vanpallethout/"><i class="bi bi-facebook"></i></a>
          <a href="https://www.instagram.com/vanpallethout/"><i class="bi bi-instagram"></i></a>
        </p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
